<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOYA AI</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#202123;
}

.zora{
    width:100%;
    max-width:900px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:#fff;
    overflow:hidden;
}

:root{
    --zora-logo:url("https://drive.google.com/thumbnail?id=13yvCD_AJqoGExm57zGdtTUEezW5EAWo9&sz=w1000");
}

.header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 22px;
    border-bottom:1px solid #eee;
    flex-shrink:0;
}

.logo,.avatar,.welcome-logo{
    background-image:var(--zora-logo);
    background-repeat:no-repeat;
    background-size:270%;
    background-position:center 38%;
    background-color:#111;
    overflow:hidden;
}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    margin-right:12px;
    flex-shrink:0;
}

.title{
    font-size:18px;
    font-weight:600;
}

.status{
    margin-left:10px;
    font-size:12px;
    color:#777;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 22px;
    scroll-behavior:smooth;
}

.message{
    display:flex;
    margin-bottom:28px;
    width:100%;
}

.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}

.avatar{
    width:32px;
    height:32px;
    border-radius:10px;
    margin-right:10px;
    flex-shrink:0;
}

.bubble{
    max-width:75%;
    line-height:1.6;
    font-size:15px;
    overflow-wrap:anywhere;
}

.user .bubble{
    background:#f0f0f0;
    padding:12px 16px;
    border-radius:18px;
    white-space:pre-wrap;
}

.ai .bubble{
    white-space:normal;
}

.ai .bubble strong{font-weight:700}
.ai .bubble em{font-style:italic}

.ai-heading{
    display:block;
    font-weight:700;
    margin-top:8px;
    margin-bottom:3px;
}

.ai-code-block{
    display:block;
    background:#f5f5f5;
    padding:10px 12px;
    margin:8px 0;
    border-radius:8px;
    font-family:monospace;
    white-space:pre-wrap;
    overflow-x:auto;
}

.ai .bubble code{
    background:#f1f1f1;
    padding:2px 5px;
    border-radius:5px;
    font-family:monospace;
    font-size:13px;
}

.ai-bullet,.ai-number{
    display:block;
    margin:2px 0;
}

.welcome{
    text-align:center;
    margin-top:100px;
}

.welcome-logo{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:20px;
}

.welcome h1{
    margin:20px 0 8px;
    font-size:26px;
}

.welcome p{
    color:#777;
    font-size:14px;
}

.loading{
    display:none;
    font-size:14px;
    color:#888;
    margin-left:64px;
    margin-bottom:12px;
    flex-shrink:0;
}

.dot{animation:blink 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes blink{
    0%,80%,100%{opacity:.2}
    40%{opacity:1}
}

.retry-status{
    display:none;
    font-size:13px;
    color:#888;
    margin-left:64px;
    margin-bottom:15px;
}

.input-area{
    padding:15px 20px 20px;
    flex-shrink:0;
}

.input-box{
    display:flex;
    align-items:center;
    border:1px solid #d9d9d9;
    border-radius:18px;
    padding:7px 8px 7px 16px;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

#question{
    flex:1;
    border:none;
    outline:none;
    font-size:15px;
    resize:none;
    font-family:inherit;
    min-height:42px;
    max-height:150px;
    padding-top:11px;
    background:transparent;
    color:#202123;
}

#question::placeholder{color:#999}

#mic,#send{
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
    transition:background .2s,color .2s,opacity .2s,transform .1s;
}

#mic{
    margin-right:6px;
    background:#f1f1f1;
    color:#111;
}

#mic:hover{background:#e7e7e7}
#mic:active,#send:active{transform:scale(.95)}

#mic.listening{
    background:#111;
    color:#fff;
}

#mic.unsupported{
    opacity:.45;
}

#send{
    background:#111;
    color:#fff;
}

#send:hover{opacity:.85}

#mic:disabled,#send:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#voiceStatus{
    display:none;
    padding:0 20px 10px;
    font-size:12px;
    color:#777;
    flex-shrink:0;
}

#voiceStatus.active{display:block}

#voiceStatus.error{color:#b00020}

@media(max-width:600px){
    .header{padding:0 18px}
    .chat{padding:20px 15px}
    .bubble{max-width:85%}
    .welcome{margin-top:80px}
    .welcome h1{font-size:23px}
    .input-area{padding:10px 12px 14px}
}
</style>
</head>

<body>

<div class="zora">

    <div class="header">
        <div class="logo"></div>
        <div class="title">ZOYA AI</div>
        <div class="status">AI Assistant</div>
    </div>

    <div class="chat" id="chat">
        <div class="welcome" id="welcome">
            <div class="welcome-logo"></div>
            <h1>Apa yang bisa saya bantu?</h1>
            <p>Tanyakan sesuatu kepada ZOYA AI</p>
        </div>
    </div>

    <div class="loading" id="loading">
        ZOYA sedang berpikir
        <span class="dot">.</span>
        <span class="dot">.</span>
        <span class="dot">.</span>
    </div>

    <div class="retry-status" id="retryStatus">
        Mencoba menghubungkan kembali...
    </div>

    <div id="voiceStatus"></div>

    <div class="input-area">
        <div class="input-box">

            <textarea
                id="question"
                placeholder="Tanya apa saja..."
                rows="1"
                autocomplete="off"
            ></textarea>

            <button
                id="mic"
                type="button"
                aria-label="Voice input"
                title="Bicara"
            >🎤</button>

            <button
                id="send"
                type="button"
                aria-label="Kirim"
                title="Kirim"
            >↑</button>

        </div>
    </div>

</div>

<script>
/* =========================================================
   ZORA AI FRONTEND
   STANDALONE WEB VERSION
   VOICE INPUT: NATIVE BROWSER PERMISSION
   ========================================================= */

/* =========================================================
   BACKEND
   ========================================================= */

const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbw33TXwySs86gmsMloKyXFSXiaQx38nnn-7Lo8-af-BK6nnchC2wGH52ogF-aVit1j7Cg/exec";

/* =========================================================
   MEMORY
   ========================================================= */

const MEMORY_KEY = "ZORA_AI_MEMORY_V7";

const MAX_HISTORY_MESSAGES = 8;
const MAX_HISTORY_CHARS = 1200;
const MAX_RETRIES = 3;
const REQUEST_TIMEOUT = 45000;

let conversationHistory = [];
let isSending = false;

/* =========================================================
   ELEMENT
   ========================================================= */

const questionInput = document.getElementById("question");
const chat = document.getElementById("chat");
const loading = document.getElementById("loading");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");
const retryStatus = document.getElementById("retryStatus");
const micButton = document.getElementById("mic");
const voiceStatus = document.getElementById("voiceStatus");

/* =========================================================
   MEMORY
   ========================================================= */

function loadMemory(){
    try{
        const saved = localStorage.getItem(MEMORY_KEY);

        if(!saved) return;

        const data = JSON.parse(saved);

        if(!Array.isArray(data)) return;

        conversationHistory = data
            .filter(function(item){
                return (
                    item &&
                    (item.role === "user" || item.role === "assistant") &&
                    typeof item.text === "string" &&
                    item.text.trim() !== ""
                );
            })
            .slice(-MAX_HISTORY_MESSAGES);

        console.log("ZORA MEMORY:", conversationHistory);

    }catch(error){
        console.error("Gagal membaca memory:", error);
        conversationHistory = [];
    }
}

function saveMemory(){
    try{
        conversationHistory =
            conversationHistory.slice(-MAX_HISTORY_MESSAGES);

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(conversationHistory)
        );

    }catch(error){
        console.error("Gagal menyimpan memory:", error);
    }
}

loadMemory();

/* =========================================================
   PREPARE HISTORY
   ========================================================= */

function prepareHistory(history){

    if(!Array.isArray(history)) return [];

    return history
        .slice(-MAX_HISTORY_MESSAGES)
        .map(function(item){

            let text = String(item.text || "");

            if(text.length > MAX_HISTORY_CHARS){
                text =
                    text.substring(0, MAX_HISTORY_CHARS) + "...";
            }

            return {
                role:item.role,
                text:text
            };
        });
}

/* =========================================================
   FORMAT AI RESPONSE
   ========================================================= */

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatAIResponse(text){

    if(!text) return "";

    let source = escapeHTML(text);

    /* Code block */
    source = source.replace(
        /```([\s\S]*?)```/g,
        function(match, code){
            return '<pre class="ai-code-block">' +
                   code.trim() +
                   '</pre>';
        }
    );

    /* Inline code */
    source = source.replace(
        /`([^`\n]+)`/g,
        '<code>$1</code>'
    );

    /* Bold */
    source = source.replace(
        /\*\*(.+?)\*\*/g,
        '<strong>$1</strong>'
    );

    source = source.replace(
        /__(.+?)__/g,
        '<strong>$1</strong>'
    );

    /* Italic */
    source = source.replace(
        /(^|[^*])\*([^*\n]+)\*(?!\*)/g,
        '$1<em>$2</em>'
    );

    /* Headings */
    source = source.replace(
        /^###\s+(.+)$/gm,
        '<span class="ai-heading">$1</span>'
    );

    source = source.replace(
        /^##\s+(.+)$/gm,
        '<span class="ai-heading">$1</span>'
    );

    source = source.replace(
        /^#\s+(.+)$/gm,
        '<span class="ai-heading">$1</span>'
    );

    /* Bullets */
    source = source.replace(
        /^[ \t]*[-*+]\s+(.+)$/gm,
        '<span class="ai-bullet">• $1</span>'
    );

    /* Numbered list */
    source = source.replace(
        /^[ \t]*(\d+)\.\s+(.+)$/gm,
        '<span class="ai-number">$1. $2</span>'
    );

    /* New lines */
    source = source.replace(/\n/g,"<br>");

    return source;
}

/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(text,type){

    const message = document.createElement("div");

    message.className = "message " + type;

    if(type === "ai"){
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        message.appendChild(avatar);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(type === "ai"){
        bubble.innerHTML = formatAIResponse(text);
    }else{
        bubble.textContent = String(text || "");
    }

    message.appendChild(bubble);
    chat.appendChild(message);

    requestAnimationFrame(function(){
        chat.scrollTop = chat.scrollHeight;
    });
}

/* =========================================================
   JSONP CALLBACK
   ========================================================= */

function createCallbackName(){

    return (
        "zoraCallback_" +
        Date.now() +
        "_" +
        Math.random().toString(36).substring(2,10)
    );
}

/* =========================================================
   ASK ZORA
   ========================================================= */

function askZora(question,history){

    return new Promise(function(resolve,reject){

        const callbackName = createCallbackName();

        let finished = false;
        let timeoutId = null;

        const script = document.createElement("script");

        function cleanup(){

            if(timeoutId){
                clearTimeout(timeoutId);
                timeoutId = null;
            }

            if(script && script.parentNode){
                script.parentNode.removeChild(script);
            }

            try{
                delete window[callbackName];
            }catch(error){
                window[callbackName] = undefined;
            }
        }

        function completeSuccess(data){

            if(finished) return;

            finished = true;
            cleanup();

            if(!data || data.success !== true){

                reject(
                    new Error(
                        data && data.error
                            ? String(data.error)
                            : "Backend ZORA tidak memberikan jawaban."
                    )
                );

                return;
            }

            resolve(data);
        }

        window[callbackName] = function(data){
            console.log("ZORA CALLBACK:",data);
            completeSuccess(data);
        };

        script.onerror = function(){

            if(finished) return;

            finished = true;
            cleanup();

            reject(
                new Error(
                    "Browser tidak menerima response dari Google Apps Script."
                )
            );
        };

        const safeHistory = prepareHistory(history);

        const params = new URLSearchParams();

        params.set("q",String(question));
        params.set("history",JSON.stringify(safeHistory));
        params.set("callback",callbackName);
        params.set("_",String(Date.now()));

        const requestUrl =
            BACKEND_URL + "?" + params.toString();

        console.log("ZORA REQUEST:",requestUrl);

        script.src = requestUrl;
        script.async = true;

        document.body.appendChild(script);

        timeoutId = setTimeout(function(){

            if(finished) return;

            finished = true;
            cleanup();

            reject(
                new Error("Response ZORA terlalu lama.")
            );

        },REQUEST_TIMEOUT);

    });
}

/* =========================================================
   WAIT
   ========================================================= */

function wait(ms){

    return new Promise(function(resolve){
        setTimeout(resolve,ms);
    });
}

/* =========================================================
   ASK WITH RETRY
   ========================================================= */

async function askZoraWithRetry(question,history){

    let lastError = null;

    for(
        let attempt = 1;
        attempt <= MAX_RETRIES;
        attempt++
    ){

        try{

            console.log("ZORA ATTEMPT:",attempt);

            if(attempt > 1){

                retryStatus.style.display = "block";

                retryStatus.textContent =
                    "Mencoba menghubungkan kembali (" +
                    attempt + "/" +
                    MAX_RETRIES + ")...";
            }

            const result =
                await askZora(question,history);

            retryStatus.style.display = "none";

            return result;

        }catch(error){

            console.error(
                "ZORA ATTEMPT " + attempt + " ERROR:",
                error
            );

            lastError = error;

            if(attempt < MAX_RETRIES){
                await wait(attempt * 1500);
            }
        }
    }

    retryStatus.style.display = "none";

    throw lastError ||
        new Error("ZORA gagal memberikan response.");
}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

async function sendMessage(){

    if(isSending) return;

    const question =
        questionInput.value.trim();

    if(!question) return;

    isSending = true;

    sendButton.disabled = true;
    micButton.disabled = true;

    if(welcome && welcome.parentNode){
        welcome.remove();
    }

    addMessage(question,"user");

    const historyToSend =
        prepareHistory(conversationHistory);

    questionInput.value = "";
    autoResizeTextarea();

    loading.style.display = "block";
    retryStatus.style.display = "none";

    try{

        const result =
            await askZoraWithRetry(
                question,
                historyToSend
            );

        const answer =
            String(result.answer || "").trim();

        if(!answer){
            throw new Error(
                "ZORA mengembalikan jawaban kosong."
            );
        }

        conversationHistory.push({
            role:"user",
            text:question
        });

        conversationHistory.push({
            role:"assistant",
            text:answer
        });

        saveMemory();

        addMessage(answer,"ai");

        console.log("ZORA SUCCESS");

    }catch(error){

        console.error("ZORA FINAL ERROR:",error);

        let errorMessage =
            "ZORA belum menerima respons dari server.";

        if(error && error.message){
            errorMessage += "\n\n" + error.message;
        }

        addMessage(errorMessage,"ai");

    }finally{

        loading.style.display = "none";
        retryStatus.style.display = "none";

        sendButton.disabled = false;
        micButton.disabled = false;

        isSending = false;

        questionInput.focus();
    }
}

/* =========================================================
   VOICE INPUT / SPEECH-TO-TEXT
   =========================================================

   PENTING:
   Tidak menggunakan getUserMedia() lagi.

   Saat user menekan 🎤, kita langsung memanggil
   recognition.start() dari event klik.

   Karena halaman ZORA sekarang adalah TOP-LEVEL HTTPS,
   browser dapat menampilkan permission microphone
   native-nya sendiri.

   Tidak ada popup HTML buatan ZORA.
   ========================================================= */

let recognition = null;
let isListening = false;
let voiceBaseText = "";

function setVoiceStatus(text,error){

    if(!text){
        voiceStatus.textContent = "";
        voiceStatus.classList.remove("active");
        voiceStatus.classList.remove("error");
        return;
    }

    voiceStatus.textContent = text;
    voiceStatus.classList.add("active");

    if(error){
        voiceStatus.classList.add("error");
    }else{
        voiceStatus.classList.remove("error");
    }
}

function setupVoiceInput(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        micButton.classList.add("unsupported");

        micButton.title =
            "Speech-to-Text tidak didukung browser ini";

        micButton.addEventListener("click",function(){

            alert(
                "Speech-to-Text tidak tersedia di browser ini.\n\n" +
                "Gunakan Google Chrome atau Microsoft Edge versi terbaru."
            );
        });

        return;
    }

    recognition = new SpeechRecognition();

    recognition.lang = "id-ID";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){

        isListening = true;

        voiceBaseText =
            questionInput.value.trim();

        micButton.classList.add("listening");
        micButton.textContent = "⏹";
        micButton.title = "Berhenti mendengarkan";

        setVoiceStatus(
            "🎙️ Mendengarkan... Bicara sekarang.",
            false
        );

        console.log("VOICE: START");
    };

    recognition.onresult = function(event){

        let transcript = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0].transcript;
        }

        transcript = transcript.trim();

        if(!transcript) return;

        questionInput.value =
            voiceBaseText
                ? voiceBaseText + " " + transcript
                : transcript;

        autoResizeTextarea();

        console.log(
            "VOICE TRANSCRIPT:",
            transcript
        );
    };

    recognition.onerror = function(event){

        console.error(
            "VOICE ERROR:",
            event.error,
            event
        );

        if(event.error === "not-allowed"){

            setVoiceStatus(
                "❌ Microphone ditolak. Klik ikon 🔒/izin situs di address bar lalu izinkan microphone, kemudian tekan 🎤 lagi.",
                true
            );

        }else if(event.error === "service-not-allowed"){

            setVoiceStatus(
                "❌ Layanan Speech Recognition tidak diizinkan browser.",
                true
            );

        }else if(event.error === "no-speech"){

            setVoiceStatus(
                "Tidak terdengar suara. Tekan 🎤 lalu bicara.",
                true
            );

        }else if(event.error === "audio-capture"){

            setVoiceStatus(
                "❌ Microphone tidak ditemukan atau sedang digunakan aplikasi lain.",
                true
            );

        }else if(event.error === "network"){

            setVoiceStatus(
                "❌ Layanan Speech-to-Text mengalami masalah jaringan.",
                true
            );

        }else{

            setVoiceStatus(
                "❌ Speech-to-Text gagal: " + event.error,
                true
            );
        }
    };

    recognition.onend = function(){

        isListening = false;

        micButton.classList.remove("listening");
        micButton.textContent = "🎤";
        micButton.title = "Bicara";

        console.log("VOICE: END");

        setTimeout(function(){

            if(!isListening){
                setVoiceStatus("");
            }

        },2500);
    };

    micButton.addEventListener("click",function(){

        if(isSending) return;

        if(!recognition) return;

        if(isListening){

            try{
                recognition.stop();
            }catch(error){
                console.error(
                    "VOICE STOP ERROR:",
                    error
                );
            }

            return;
        }

        voiceBaseText =
            questionInput.value.trim();

        setVoiceStatus(
            "🎤 Meminta akses microphone...",
            false
        );

        /*
         * JANGAN memakai await getUserMedia() di sini.
         *
         * recognition.start() harus dipanggil langsung
         * dari klik tombol agar browser mengenali
         * ini sebagai user gesture.
         */

        try{

            recognition.start();

        }catch(error){

            console.error(
                "VOICE START ERROR:",
                error
            );

            if(error.name === "InvalidStateError"){

                setTimeout(function(){

                    if(!isListening){

                        try{
                            recognition.start();
                        }catch(retryError){

                            console.error(
                                "VOICE RETRY ERROR:",
                                retryError
                            );

                            setVoiceStatus(
                                "❌ Gagal memulai microphone. Muat ulang halaman lalu coba lagi.",
                                true
                            );
                        }
                    }

                },300);

            }else{

                setVoiceStatus(
                    "❌ Gagal memulai Speech-to-Text: " +
                    error.message,
                    true
                );
            }
        }
    });
}

setupVoiceInput();

/* =========================================================
   AUTO RESIZE
   ========================================================= */

function autoResizeTextarea(){

    questionInput.style.height = "auto";

    const newHeight =
        Math.min(
            questionInput.scrollHeight,
            150
        );

    questionInput.style.height =
        newHeight + "px";
}

questionInput.addEventListener(
    "input",
    autoResizeTextarea
);

/* =========================================================
   ENTER
   ========================================================= */

questionInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();
            sendMessage();
        }
    }
);

/* =========================================================
   INITIALIZATION
   ========================================================= */

console.log("=================================");
console.log("ZOYA AI STANDALONE V7 AKTIF");
console.log("BACKEND:",BACKEND_URL);
console.log("MEMORY:",conversationHistory);
console.log(
    "SpeechRecognition:",
    !!recognition
);
console.log("=================================");
</script>

</body>
</html>
